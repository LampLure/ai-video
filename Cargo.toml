[package]
name = "ai_video"
version = "0.1.0"
edition = "2021"

[lib]
name = "ai_video"
path = "src/lib.rs"

[[bin]]
name = "ai-video"
path = "src/main.rs"

[features]
default = []
desktop = ["tauri"]

[dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
hex = "0.4"
reqwest = { version = "0.12", features = ["json", "blocking"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tauri = { version = "1.6", features = ["api-all"], optional = true }
thiserror = "1.0"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros"] }
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.12"
