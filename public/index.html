<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Video</title>
  <style>
    :root { color-scheme: dark; --bg:#1f1f1f; --panel:#2b2b2b; --panel2:#343434; --text:#e7e7e7; --muted:#9c9c9c; --line:#454545; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, sans-serif; background:var(--bg); color:var(--text); }
    #app { display:grid; grid-template-columns: 230px 1fr 260px; grid-template-rows: 1fr 220px; width:100vw; height:100vh; min-width:800px; min-height:600px; }
    aside.left { grid-row:1 / 3; background:var(--panel); border-right:1px solid var(--line); padding:14px; resize:horizontal; overflow:auto; min-width:180px; max-width:380px; }
    main { background:#181818; display:flex; align-items:center; justify-content:center; padding:16px; }
    aside.right { background:var(--panel); border-left:1px solid var(--line); overflow:auto; padding:10px; }
    section.chat { grid-column:2 / 4; background:var(--panel2); border-top:1px solid var(--line); display:flex; flex-direction:column; min-height:160px; resize:vertical; overflow:auto; }
    button, input { background:#3b3b3b; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:8px 10px; }
    button { display:block; width:100%; margin-bottom:8px; cursor:pointer; text-align:left; }
    .preview { width:100%; height:100%; border:1px dashed var(--line); display:flex; align-items:center; justify-content:center; color:var(--muted); }
    .video-card { border:1px solid var(--line); border-radius:8px; padding:8px; margin-bottom:8px; background:#252525; }
    .thumb { height:80px; background:#151515; border-radius:5px; margin-bottom:6px; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:12px; }
    .messages { flex:1; overflow:auto; padding:10px; }
    .bubble { border:1px solid var(--line); border-radius:8px; background:#242424; padding:8px; margin-bottom:8px; white-space:pre-wrap; }
    .input-row { display:flex; gap:8px; padding:10px; border-top:1px solid var(--line); }
    .input-row input { flex:1; }
    h3 { margin:10px 0; font-size:15px; }
    small { color:var(--muted); }
  </style>
</head>
<body>
  <div id="app">
    <aside class="left">
      <h3>AI Video</h3>
      <button id="openFolder">打开文件夹</button>
      <button id="scanDemo">分析文件</button>
      <button id="aiMode">AI 分析</button>
      <button id="settings">设置</button>
      <small>灰色主题 / Rust Tauri 后端 / SQLite FTS5 / llama.cpp Agent</small>
    </aside>
    <main><div class="preview" id="preview">当前视频预览区域</div></main>
    <aside class="right" id="rightList"><h3>视频列表</h3></aside>
    <section class="chat">
      <div class="messages" id="messages"><div class="bubble">程序已启动。请选择文件夹开始扫描。</div></div>
      <div class="input-row"><input id="chatInput" placeholder="暂停后台分析后，可针对当前视频提问" /><button id="send" style="width:90px;text-align:center">发送</button></div>
    </section>
  </div>
<script>
const invoke = window.__TAURI__?.tauri?.invoke;
const messages = document.getElementById('messages');
const rightList = document.getElementById('rightList');
function addMessage(text){ const el=document.createElement('div'); el.className='bubble'; el.textContent=text; messages.appendChild(el); messages.scrollTop=messages.scrollHeight; }
function renderVideos(videos){ rightList.innerHTML='<h3>视频列表</h3>'; videos.forEach(v=>{ const card=document.createElement('div'); card.className='video-card'; card.innerHTML=`<div class="thumb">${v.width||0}x${v.height||0}</div><div>${v.name}</div><small>${Math.round(v.duration||0)}s</small>`; card.onclick=()=>document.getElementById('preview').textContent=v.path; rightList.appendChild(card); }); }
document.getElementById('openFolder').onclick = async()=>{ addMessage('当前 shell 未接入系统目录选择器，请后续接入 Tauri dialog 后调用 scan_videos。'); };
document.getElementById('scanDemo').onclick = async()=>{ if(!invoke){ addMessage('Tauri invoke 不可用。'); return; } try{ const path=prompt('输入要递归扫描的视频目录路径'); if(!path) return; const videos=await invoke('scan_videos',{dir:path}); renderVideos(videos); addMessage(`扫描完成：${videos.length} 个视频`); }catch(e){ addMessage('扫描失败：'+e); }};
document.getElementById('send').onclick = async()=>{ const input=document.getElementById('chatInput'); const q=input.value.trim(); if(!q) return; input.value=''; addMessage('用户：'+q); if(!invoke){ addMessage('AI：Tauri invoke 不可用。'); return; } try{ const ans=await invoke('ask_current_video',{question:q}); addMessage('AI：'+ans); }catch(e){ addMessage('程序：'+e); }};
</script>
</body>
</html>
